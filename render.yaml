services:
  - type: web
    name: banco-talentos-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: SESSION_TTL_DAYS
        value: 30
      - key: DB_CONNECTION_TIMEOUT_MS
        value: 60000
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: banco-talentos
      - key: SUPABASE_SIGNED_URL_TTL_SECONDS
        value: 900
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: true
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_CODE_SECRET
        generateValue: true
      - key: EMAIL_CODE_TTL_MINUTES
        value: 10
      - key: EMAIL_CODE_MAX_ATTEMPTS
        value: 5
      - key: EMAIL_CODE_RESEND_SECONDS
        value: 60
